      - KafkaProducerSettings:ConnectionString=${KafkaConnectionString}
      - KafkaProducerSettings:SecurityProtocol=${KafkaSecurityProtocol}
      - KafkaProducerSettings:Topic=${KafkaTopic}

      ## Kafka Consumer
