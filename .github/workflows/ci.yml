# CI on GitHub. Nothing is published or deployed from here; deployments build from the repository themselves.
#   pull requests and pushes to main: tests, NuGet vulnerability audit, config hygiene, gitleaks on the new commits,
#                                     then every service image is built, checked for secrets and configuration,
#                                     and scanned by Trivy
#   weekly (Monday) and on demand:    the image build and scans again, on fresh base images and a fresh CVE database
# Actions and images are pinned by commit or digest; the tag beside each pin is for readers. Dependabot bumps both.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_IMAGE: "ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f"
  TRIVY_IMAGE: "aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c"
  # Trivy reads these from the environment. Report-only for now: set TRIVY_EXIT_CODE to "1" to fail the build on
  # fixable HIGH/CRITICAL findings. Accepted findings: .trivyignore
  TRIVY_SEVERITY: "HIGH,CRITICAL"
  TRIVY_IGNORE_UNFIXED: "true"
  TRIVY_EXIT_CODE: "0"
  TRIVY_IGNOREFILE: "${{ github.workspace }}/.trivyignore"
  TRIVY_DB_REPOSITORY: "ghcr.io/aquasecurity/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2"

jobs:
  # Tests, NuGet's vulnerability audit with high/critical findings as errors, and the config hygiene check.
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0.403@sha256:de4fe90a98845d75910b9769662465c84de1a934665c431279d1382b2bddc02b
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No server-side response caching anywhere (it would serve one user's data to another)
        run: "! grep -rnE --include='*.cs' --exclude-dir=obj --exclude-dir=bin 'AddOutputCache|UseOutputCache|AddResponseCaching|UseResponseCaching|\\[OutputCache|\\[ResponseCache' ."
      - name: No credentials or environment-specific configuration in tracked files
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./check-config-hygiene.sh repo
      - run: dotnet restore daikon.sln -warnaserror:NU1903,NU1904
      - run: dotnet test BuildingBlocks/Daikon.ApiHost.Test/Daikon.ApiHost.Test.csproj
      - run: dotnet test ApiGateways/SimpleGW/SimpleGW.Test/SimpleGW.Test.csproj
      - run: dotnet test Identities/UserStore/UserStore.Test/UserStore.Test.csproj
      - run: dotnet test Services/Screen/Screen.Test/Screen.Test.csproj

  # Secrets in the commits being pushed or proposed. GitHub's own secret scanning and push protection run on top of this.
  secrets:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks on the new commits
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          case "$BEFORE" in ""|0000000000000000000000000000000000000000) RANGE="-1" ;; *) RANGE="$BEFORE..$GITHUB_SHA" ;; esac
          docker run --rm -v "$PWD:/repo" -w /repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            "$GITLEAKS_IMAGE" git --redact --verbose --log-opts="$RANGE" /repo

  # Build each image on freshly pulled base images and scan it. The image is discarded afterwards.
  build:
    needs: [test, secrets]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: userstore-api, dockerfile: Identities/UserStore/UserStore.API/Dockerfile }
          - { service: gene-api, dockerfile: Services/Gene/Gene.API/Dockerfile }
          - { service: target-api, dockerfile: Services/Target/Target.API/Dockerfile }
          - { service: screen-api, dockerfile: Services/Screen/Screen.API/Dockerfile }
          - { service: hitassessment-api, dockerfile: Services/HitAssessment/HitAssessment.API/Dockerfile }
          - { service: project-api, dockerfile: Services/Project/Project.API/Dockerfile }
          - { service: horizon-api, dockerfile: Services/Horizon/Horizon.API/Dockerfile }
          - { service: mlogix-api, dockerfile: Services/MLogix/MLogix.API/Dockerfile }
          - { service: questionnaire-api, dockerfile: Services/Questionnaire/Questionnaire.API/Dockerfile }
          - { service: comment-api, dockerfile: Services/Comment/Comment.API/Dockerfile }
          - { service: simplegw-api, dockerfile: ApiGateways/SimpleGW/SimpleGW.API/Dockerfile }
          - { service: event-history-api, dockerfile: Services/EventHistory/EventHistory.API/Dockerfile }
          - { service: docustore-api, dockerfile: Services/DocuStore/DocuStore.API/Dockerfile }
          - { service: event-management-api, dockerfile: Extensions/Daikon.EventManagement/Dockerfile }
          - { service: user-preferences-api, dockerfile: Services/UserPreferences/UserPreferences.API/Dockerfile }
          - { service: aggregators-api, dockerfile: Aggregators/Aggregators.API/Dockerfile }
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --pull -t "daikon/${{ matrix.service }}:ci" -f "${{ matrix.dockerfile }}" .
      - name: Trivy, copied out of its pinned image
        run: |
          docker create --name trivy "$TRIVY_IMAGE" >/dev/null
          docker cp trivy:/usr/local/bin/trivy "$RUNNER_TEMP/trivy"
          docker rm trivy >/dev/null
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # Nothing secret or environment-specific inside the image: the tracked-config rules on /app, then Trivy's
      # secret scanner. Both fail the job, unlike the vulnerability scan below while TRIVY_EXIT_CODE is "0".
      - run: ./check-config-hygiene.sh image "daikon/${{ matrix.service }}:ci"
      - run: docker save "daikon/${{ matrix.service }}:ci" -o image.tar
      - run: trivy image --scanners secret --severity CRITICAL,HIGH,MEDIUM --exit-code 1 --input image.tar
      - name: Vulnerability scan (report-only while TRIVY_EXIT_CODE is "0")
        run: trivy image --input image.tar
